[project]
name = "zmp"
version = "0.2.0"
description = "Zapret Marketplace Patcher — установщик модов из Zapret Marketplace."
authors = [
    {name = "peachoff", email = "peshoff@proton.me"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "customtkinter>=5.2.0",
    "packaging",
]

[tool.poetry]
packages = [{include = "zmp", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = ">=2.31.0"
pyyaml = ">=6.0"
customtkinter = ">=5.2.0"
packaging = ">=21.0"

[tool.poetry.group.build.dependencies]
pyinstaller = ">=6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
