[project]
name = "zmp"
version = "0.1.0"
description = "Zapret Marketplace Patcher, утилита для установки модификаций из Zapret Marketplace в чистый Zapret."
authors = [
    {name = "peachoff",email = "peshoff@proton.me"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "pyyaml>=6.0"
]

[tool.poetry]
packages = [{include = "zmp", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
requests = ">=2.31.0"
customtkinter = ">=5.2.0"
pyyaml = ">=6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
