[project]
name = "zmp"
version = "0.1.0"
description = "Zapret Marketplace Patcher, утилита для установки модификаций из Zapret Marketplace в чистый Zapret."
authors = [
    {name = "peachoff",email = "peshoff@proton.me"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.0"
]

[tool.poetry]
packages = [{include = "zmp", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
