name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 1.2.3). AppImage будет назван ZMP-<версия>-x86_64.AppImage. При запуске по тегу берётся из тега.'
        required: false
        default: 'dev'

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build portable exe
        run: poetry run pyinstaller build/win.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZMP-windows
          path: dist/ZMP/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            libglib2.0-0 libgl1 libegl1 \
            libfontconfig1 libxkbcommon0 \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build one-file binary
        run: poetry run pyinstaller build/linux.spec --noconfirm

      - name: Build AppImage
        run: |
          echo "Building at commit: $GITHUB_SHA"
          poetry run pyinstaller build/linux_appimage.spec --noconfirm
          chmod +x build/build_appimage.sh
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Using version: v${VERSION}"
          cd build && bash build_appimage.sh "v${VERSION}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZMP-linux
          path: dist/ZMP-*.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZMP-windows/**
            ZMP-linux/**
          generate_release_notes: true
