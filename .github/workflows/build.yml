name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без буквы v (например 1.2.3). Используется для всех артефактов и тега v<версия>.'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'vdev') }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build portable exe
        run: poetry run pyinstaller build/win.spec --noconfirm

      - name: Package Windows build
        shell: pwsh
        run: |
          $zip = "dist/ZMP-${{ env.APP_VERSION }}.zip"
          Compress-Archive -Path "dist/ZMP/*" -DestinationPath $zip
          Write-Host "Packaged: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZMP-windows
          path: dist/ZMP-${{ env.APP_VERSION }}.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            libglib2.0-0 libgl1 libegl1 \
            libfontconfig1 libxkbcommon0 \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Build one-file binary
        run: poetry run pyinstaller build/linux.spec --noconfirm

      - name: Build AppImage
        run: |
          echo "Building at commit: $GITHUB_SHA"
          echo "Using version: ${{ env.APP_VERSION }}"
          poetry run pyinstaller build/linux_appimage.spec --noconfirm
          chmod +x build/build_appimage.sh
          cd build && bash build_appimage.sh "${{ env.APP_VERSION }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZMP-linux
          path: dist/ZMP-${{ env.APP_VERSION }}-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Create and push version tag if missing
        run: |
          TAG="${{ env.APP_VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping"
          else
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "Tag ${TAG} created and pushed"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          files: |
            artifacts/ZMP-windows/**
            artifacts/ZMP-linux/**
          generate_release_notes: true
